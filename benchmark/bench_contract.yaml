# bench_contract.yaml — generated by flutter_bench_contract (template v2).
# Options only: scenario selection and consumer config; metric definitions
# and protocol values live in the package.
library: hintful
driver: bench/drivers/hintful_driver.dart
driverClass: HintfulDriver
contractDir: bench/contract
scenarios: [idle_zero, idle_resources, show_latency, update_latency, scroll_coupled, active_heap, hide_retention, size]
# S1r idle_resources: on-device count of live instances of these classes
# after hide (max per-class delta; 0 = no idle leak).
idleClasses: [HintController, HintOverlayHost]

# S7 size (host release builds): native = analyze-size subtree of
# package:hintful; web = main.dart.js diff vs the identical main_baseline.
size:
  native:
    package: hintful
  web:
    without: lib/main_baseline.dart

# Custom scenario: own metric id (custom.*) and golden ref, excluded from
# the comparison tables.
customScenarios:
  startup_to_show:
    target: bench/startup_to_show_test.dart
    ref: android-custom
    runs: 1

# Card PNG rendered from recorded goldens. Footer/legend = package defaults
# (head-to-head legend derived from the readme columns below).
card:
  out: ../docs/hint_metrics.png
  title: 'hintful benchmarks — contract'
  subtitle: 'profile build · Android x64 · S1–S7 contract scenarios'

readme:
  target: ../README.md
  title: Performance
  intro: >
    One scene, three solutions: the contract scenarios S1–S6 on a profile
    Android emulator plus the host size builds (S7). Values are the recorded
    goldens in `benchmarks.json` (refs `android` / `android-scv` /
    `android-tcm`). Methodology: `benchmark/README.md`;
    `benchmark/compare` hosts the rival drivers.
  columns:
    hintful:
      refs: [android, any]
      fallbackAny: true
    showcaseview:
      refs: [android-scv]
      fallbackAny: false
    tutorial_coach_mark:
      refs: [android-tcm]
      fallbackAny: false
  footnote: >
    **n/a** = not applicable for this solution. Scroll coupling (S4) is a
    two-sided in-scenario assert, not a numeric row: hintful re-anchors its
    content to the target under programmatic scroll on-device, while
    showcaseview and tutorial_coach_mark do not (their overlays consume
    pointer input). The idle-resources row (S1r) is declared on-device via
    `idleClasses` — 0 means the solution holds no live control-plane
    instances while idle. The size rows are hintful-only because the rival
    scenes were never shipped as size targets.
  image: docs/hint_metrics.png
  imageAlt: hintful benchmark metrics
  stamp: '_Recorded {ts}. Regenerate: dispatch the `bench-core` workflow with `record`._'
