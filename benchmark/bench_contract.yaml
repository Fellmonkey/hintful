template: 2
# bench_contract.yaml — generated by flutter_bench_contract (template v2).
# The consumer picks SCENARIOS, never metric definitions or protocol values.
library: hintful
driver: bench/drivers/hintful_driver.dart
driverClass: HintfulDriver
contractDir: bench/contract
scenarios: [idle_zero, idle_resources, show_latency, update_latency, scroll_coupled, active_heap, hide_retention, size]
# idleClasses: [MyController, MyRegistry]   # for idle_resources (S1r)

# S7 size (host release builds, no device; runs inside `contract run`):
#   native: analyze-size subtree of package:hintful in one release APK.
#   web: two release web builds (lib/main.dart WITH hintful vs the
#   structurally identical lib/main_baseline.dart) diffed on main.dart.js.
size:
  native:
    package: hintful
  web:
    without: lib/main_baseline.dart
# rivals:
#   showcaseview:
#     driver: bench/drivers/scv_driver.dart
#     driverClass: ScvDriver

# Custom scenarios (Р15, consumer-owned): metric id custom.startup_to_show,
# own golden ref (android-custom), excluded from rivals/tables. The test
# (bench/startup_to_show_test.dart) reports the metric; contract run
# records/checks it under this ref.
customScenarios:
  startup_to_show:
    target: bench/startup_to_show_test.dart
    ref: android-custom
    runs: 1

# Published results — marketing copy is hintful's, machinery (layout,
# formatting, fonts, rows) is the package's. `contract card` renders the
# metrics-card PNG from the recorded goldens; `contract readme` renders the
# root-README Performance section between the bench markers.
card:
  out: ../docs/hint_metrics.png
  title: 'hintful benchmarks — contract'
  subtitle: 'profile build · Android x64 · S1–S7 contract scenarios'
  note: |
    Methodology: benchmark/README.md.
    Regenerate: bench-core workflow, record input.
  legend: 'hintful only — see README for the head-to-head table'
  subtitles:
    idle_zero: 'scene with solution vs base — zero means no idle tax'
    show_latency: 'cold show() to a stable, visible tooltip'
    update_latency: 'median step/content change on an active tour'
    active_heap: 'retained heap: idle → active step'
    hide_retention: 'heap drift after hide() — leaks show up here'
    native_size: 'release AOT, package:hintful subtree (analyze-size)'
    bundle_delta: 'web startup bundle with − without the engine'

readme:
  target: ../README.md
  title: Performance
  intro: >
    One scene, three solutions: the contract scenarios S1–S6 on a profile
    Android emulator plus the host size builds (S7). Values are the recorded
    goldens in `benchmarks.json` (refs `android` / `android-scv` /
    `android-tcm`). Methodology: `benchmark/README.md`;
    `benchmark/compare` hosts the rival drivers.
  columns:
    hintful:
      refs: [android, any]
      fallbackAny: true
    showcaseview:
      refs: [android-scv]
      fallbackAny: false
    tutorial_coach_mark:
      refs: [android-tcm]
      fallbackAny: false
  footnote: >
    **n/a** = not applicable for this solution: scroll coupling (S4) and the
    resource count (S1r) are two-sided in-scenario asserts / diagnostics,
    not numeric rows — hintful follows the anchor under programmatic scroll
    on-device, while showcaseview and tutorial_coach_mark do not re-anchor
    (their overlays consume pointer input). The size rows are hintful-only
    because the rival scenes were never shipped as size targets.
  image: docs/hint_metrics.png
  imageAlt: hintful benchmark metrics
  stamp: '_Recorded {ts}. Regenerate: dispatch the `bench-core` workflow with `record`._'
