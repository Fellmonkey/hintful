name: benchmark
description: "hintful's consumer of flutter_bench_contract: S1–S7 contract scenarios on a profile device + the host size builds, publishing the metrics card and README table."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  # The only dependency on the package — through the public barrel.
  hintful:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Contract runs: `flutter drive --profile` on a device/emulator.
  integration_test:
    sdk: flutter
  # Contract core: collectors/report/golden-store + the CLI (run, size,
  # verify). Hosted from pub.dev (the package is published) so CI resolves
  # it without a sibling checkout.
  flutter_bench_contract: ^0.3.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
