name: benchmark
description: "Benchmark harness for hintful: frame, startup and memory contracts on a device."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  # The only dependency on the package — through the public barrel.
  hintful:
    path: ../
  # Heap measurement (memory benchmarks): VM-service RPCs from inside the
  # test process — the same protocol the DevTools Memory page uses. Pinned
  # to the SDK's own transitive copy.
  vm_service: ^15.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Contract runs: `flutter drive --profile` on a device/emulator.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true