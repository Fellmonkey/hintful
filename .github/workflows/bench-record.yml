name: bench-record

# The contract run in one dispatch. One job = one runner, one image pull, one
# checkout, one commit (the runner image, digest-pinned via the action, holds
# all emulator setup).
#
# Step order is load-bearing:
#   1. Web size leg — host-only, no emulator (`bundle_delta`, ref `any`).
#   2. Rival drivers — OPT-IN via `compare`: rivals rarely change, so a normal
#      record reruns only hintful and keeps their goldens; enable after bumping
#      a rival or on a fresh setup.
#   3. hintful's record — device legs, then re-render + commit of the README
#      "Performance" section and the metrics card.
# The web leg writes the shared store before step 3, so that one commit already
# carries the new web number.
#
# `record` off runs the same job as a gate against the goldens, device legs
# only — the web golden is gated on every PR by the `bundle` job in ci.yml.
on:
  workflow_dispatch:
    inputs:
      record:
        description: 'Record goldens into benchmark/benchmarks.json (default: check against them)'
        type: boolean
        default: false
      compare:
        description: 'Also run the rival drivers (benchmark/compare). Rival libraries rarely change — leave off for routine runs, enable after bumping a rival or on a fresh setup.'
        type: boolean
        default: false
      flutter-version:
        description: 'Flutter version of the goldens (e.g. 3.47; the host web leg pins it exactly as 3.47.0)'
        default: '3.47'

permissions:
  contents: write

jobs:
  bench-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Flutter for the host-only web size leg below, pinned to the exact SDK of
      # the golden (the version the `bundle` job in ci.yml checks with) —
      # bundle_delta is deterministic per SDK, so any other version records a
      # wrong number. Record-only, so a check-mode dispatch skips the install.
      - uses: subosito/flutter-action@v2
        if: ${{ inputs.record }}
        with:
          flutter-version: ${{ format('{0}.0', inputs.flutter-version) }}
          cache: true
      # Same command as the `bundle` gate in ci.yml (ref `any` comes from the
      # manifest), only recording — checking the web golden is that job's job,
      # on every PR. It runs before the core step so the card/README render that
      # follows already sees the new web number: one commit carries both legs.
      - name: Web size golden (ref any)
        if: ${{ inputs.record }}
        working-directory: benchmark
        run: |
          flutter pub get
          dart run flutter_bench_contract:contract run --scenarios size --legs web --mode record
      # Rivals before the core step: their per-library goldens (android-scv /
      # android-tcm) land in the parent store, so the hintful record below
      # re-renders the table/card with all columns already in place.
      - name: Compare (rivals → shared store)
        if: ${{ inputs.compare }}
        uses: Fellmonkey/flutter_bench_contract/action@v1
        with:
          mode: ${{ inputs.record && 'record' || 'check' }}
          ref: android
          dir: benchmark/compare
          store: ../benchmarks.json
          flutter: ${{ inputs.flutter-version }}
          commit: ${{ inputs.record }}
          commit-patterns: benchmark/benchmarks.json
      # Core last: hintful's record re-renders + commits README/card with all
      # three columns from the same image/session (contract fairness rule).
      - name: Core (hintful → card/README)
        uses: Fellmonkey/flutter_bench_contract/action@v1
        with:
          mode: ${{ inputs.record && 'record' || 'check' }}
          ref: android
          dir: benchmark
          flutter: ${{ inputs.flutter-version }}
          commit: ${{ inputs.record }}
          commit-patterns: README.md doc/hint_metrics.png benchmark/benchmarks.json
          charts: ${{ inputs.record }}
          comment: 'false'
      - name: Upload reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-reports
          if-no-files-found: warn
          path: |
            benchmark/build/contract_*.jsonl
            benchmark/build/custom_*.jsonl
            benchmark/compare/build/contract_*.jsonl
            benchmark/compare/build/custom_*.jsonl
