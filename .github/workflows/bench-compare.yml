name: bench-compare

# Records (or gates) the rival drivers' contract goldens — showcaseview and
# tutorial_coach_mark under refs android-scv / android-tcm — into the SHARED
# parent store (benchmark/benchmarks.json). Runs on the SAME digest-pinned
# runner image and Flutter version as the hintful bench-core dispatch, so
# every column of the published README head-to-head comes from one
# environment/session (the contract's fairness rule, plan §12.3).
#
# Dispatch bench-compare (record) BEFORE bench-core (record): the rival
# columns land in the store first, then the hintful record re-renders and
# commits the card/README table with all three columns in one publish.
on:
  workflow_dispatch:
    inputs:
      record:
        description: 'Record rival goldens into benchmark/benchmarks.json (default: check against them)'
        type: boolean
        default: false
      flutter-version:
        description: 'Runner image tag = Flutter version of the goldens (e.g. 3.47)'
        default: '3.47'

permissions:
  contents: write

jobs:
  bench-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action boots the pinned image's emulator and runs both rival
      # drivers (libraries: in compare's manifest, per-library refs); the
      # store input points at the parent benchmark store the README/card
      # read. Per-library goldens are committed in record mode.
      - uses: Fellmonkey/flutter_bench_contract/action@v1
        with:
          mode: ${{ inputs.record && 'record' || 'check' }}
          ref: android
          dir: benchmark/compare
          store: ../benchmarks.json
          flutter: ${{ inputs.flutter-version }}
          commit: ${{ inputs.record }}
          commit-patterns: benchmark/benchmarks.json
      - name: Upload report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-compare-report
          if-no-files-found: warn
          path: |
            benchmark/compare/build/contract_*.jsonl
            benchmark/compare/build/custom_*.jsonl
