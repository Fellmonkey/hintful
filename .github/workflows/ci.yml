name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:
    inputs:
      record:
        description: 'Record goldens into benchmarks.json (default: check against them)'
        type: boolean
        default: false

jobs:
  test:
    # Analyze + unit tests for every package; the other jobs depend on this
    # one, so nothing runs on a broken tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test (package)
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Test (example)
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test

  web:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build web (example)
        working-directory: example
        run: flutter build web

  bundle:
    # Startup-bundle delta (two release web builds, ~2 min): runs on every
    # PR and push. The golden is SDK-pinned — Flutter is pinned to match.
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - name: Pub get (benchmark)
        working-directory: benchmark
        run: flutter pub get
      - name: Bundle delta (against the golden)
        working-directory: benchmark
        run: |
          mkdir -p build
          bash ./tool/bundle_delta.sh > build/bundle_report.jsonl
          dart run tool/check_goldens.dart build/bundle_report.jsonl --check --ref any

  bench-core:
    # Canonical contract run on an Android emulator (~20 min): 5 profile
    # benchmarks (flutter drive --no-dds --profile; --no-dds is required
    # for the in-test VM-service heap measurement) + native-size analysis.
    # Dispatch-only (long; its outcome is published, not a gate). With the
    # `record` input it writes goldens and commits the re-rendered README
    # "Performance" section back.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # NOTE: scripts are run via `bash` (no exec-bit dependency — Windows
      # commits can't carry the +x bit), and the emulator-runner executes
      # `script` one line at a time, so `cd benchmark` must ride on the same
      # line as the invocation.
      - name: Bench-core (record goldens)
        if: inputs.record
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: cd benchmark && BENCH_MODE=record bash ./tool/run_bench_core.sh emulator-5554
      - name: Bench-core (check against goldens)
        if: ${{ !inputs.record }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: cd benchmark && bash ./tool/run_bench_core.sh emulator-5554
      - name: Render root README benchmark section
        working-directory: benchmark
        run: |
          dart run tool/render_readme.dart build/bench_report.jsonl ../README.md
          mkdir -p ../docs
          cp build/screenshots/hint_metrics.png ../docs/hint_metrics.png 2>/dev/null || true
      # Commits with the action's default identity (github-actions[bot]) and
      # skips cleanly when a record run produced no changes.
      - name: Commit results (record mode)
        if: inputs.record
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bench: publish results (goldens + metrics card)"
          file_pattern: README.md docs/hint_metrics.png benchmark/benchmarks.json
      - name: Upload report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: benchmark/build/bench_report.jsonl

  bench:
    # Benchmark VM sanity (invariants + printed numbers): cheap, so it also
    # runs on PRs alongside the package tests.
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze (benchmark)
        working-directory: benchmark
        run: |
          flutter pub get
          flutter analyze
      - name: Benchmark sanity (VM)
        working-directory: benchmark
        run: flutter test bench/