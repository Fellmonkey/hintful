name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:
    inputs:
      record:
        description: 'Record goldens into benchmarks.json (default: check against them)'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get (package)
        run: flutter pub get
      - name: Analyze (package)
        run: flutter analyze
      - name: Test (package)
        run: flutter test
      - name: Pub get (example)
        working-directory: example
        run: flutter pub get
      - name: Analyze (example)
        working-directory: example
        run: flutter analyze
      - name: Test (example smoke)
        working-directory: example
        run: flutter test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build web (example)
        working-directory: example
        run: flutter build web

  bundle:
    # Startup-bundle delta (two release web builds, ~2 min): runs on every
    # PR and push. The golden is SDK-pinned — Flutter is pinned to match.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - name: Pub get (benchmark)
        working-directory: benchmark
        run: flutter pub get
      - name: Bundle delta (against the golden)
        working-directory: benchmark
        run: |
          ./tool/bundle_delta.sh > build/bundle_report.jsonl
          dart run tool/check_goldens.dart build/bundle_report.jsonl --check --ref any

  bench-core:
    # Canonical contract run: 5 profile benchmarks (flutter drive
    # --no-dds --profile; --no-dds is required for the in-test VM-service
    # heap measurement) + native-size analysis, on an Android emulator.
    # ~15-20 min: only on main pushes and manual dispatch, never on PRs
    # (PRs get the cheaper bundle job). With the `record` input it writes
    # goldens and uploads the updated benchmarks.json instead of checking.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Bench-core (record or check)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            cd benchmark
            if [ "${{ github.event_name == 'workflow_dispatch' && inputs.record }}" = "true" ]; then
              BENCH_MODE=record ./tool/run_bench_core.sh emulator-5554
            else
              ./tool/run_bench_core.sh emulator-5554
            fi
      - name: Upload updated benchmarks.json (record mode)
        if: github.event_name == 'workflow_dispatch' && inputs.record
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks.json
          path: benchmark/benchmarks.json
      - name: Upload report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: benchmark/build/bench_report.jsonl

  bench:
    # Benchmark VM sanity (invariants + printed numbers): cheap, so it also
    # runs on PRs alongside the package tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get (benchmark)
        working-directory: benchmark
        run: flutter pub get
      - name: Benchmark sanity (VM)
        working-directory: benchmark
        run: flutter test bench/