name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

jobs:
  test:
    # Analyze + unit tests for every package; the other jobs depend on this
    # one, so nothing runs on a broken tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test (package)
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Test (example)
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test

  web:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build web (example)
        working-directory: example
        run: flutter build web

  bundle:
    # Startup-bundle delta (two release web builds, ~2 min): runs on every
    # PR and push. The golden is SDK-pinned — Flutter is pinned to match.
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - name: Pub get (benchmark)
        working-directory: benchmark
        run: flutter pub get
      - name: Bundle delta (against the golden)
        working-directory: benchmark
        # S7 web leg only (--legs web skips the native APK build): `contract
        # run` executes the size scenario once per manifest, and bundle_delta
        # is checked under its SDK-pinned golden ref `any`.
        run: dart run flutter_bench_contract:contract run --scenarios size --legs web --mode check

  bench:
    # Contract + custom-scenario VM sanity (scenarios degrade on VM where the
    # VM service is unavailable): cheap, so it also runs on PRs alongside the
    # package tests. Device runs are the bench-core dispatch (bench-core.yml).
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze (benchmark)
        working-directory: benchmark
        run: |
          flutter pub get
          flutter analyze
      - name: Contract scenarios + custom (VM)
        working-directory: benchmark
        run: flutter test bench/