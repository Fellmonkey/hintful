name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

# Read-only: every job here builds and tests, none of them writes to the repo.
permissions:
  contents: read

jobs:
  test:
    # Analyze + unit tests for every package; the other jobs depend on this
    # one, so nothing runs on a broken tree. The 2.x line supports both the
    # floor SDK (3.47, material_ui's minimum) and the current stable release.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.47.0', '3.50.0']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.sdk }}
          channel: stable
          cache: true
      - name: Test (package)
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Test (example)
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Format check
        run: dart format --set-exit-if-changed .
      - name: Publish dry-run
        run: flutter pub publish --dry-run

  bundle:
    # Startup-bundle delta (two release web builds, ~2 min): runs on every
    # PR and push. The golden is SDK-pinned — Flutter is pinned to match.
    # 2.x keeps this leg at its 3.47.0 floor; re-record with `bench-record`
    # before moving it to 3.50.0.
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - name: Pub get (benchmark)
        working-directory: benchmark
        run: flutter pub get
      - name: Bundle delta (against the golden)
        working-directory: benchmark
        # S7 web leg only (--legs web skips the native APK build): `contract
        # run` executes the size scenario once per manifest, and bundle_delta
        # is checked under its SDK-pinned golden ref `any`.
        run: dart run flutter_bench_contract:contract run --scenarios size --legs web --mode check

  bench:
    # Contract + custom-scenario VM sanity (scenarios degrade on VM where the
    # VM service is unavailable): cheap, so it also runs on PRs alongside the
    # package tests. Device runs are the bench-record dispatch (bench-record.yml).
    # Stays separate from `bundle` on purpose: that golden is pinned to exactly
    # 3.47.0, while these scenarios run on both supported SDKs.
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.47.0', '3.50.0']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.sdk }}
          channel: stable
          cache: true
      - name: Analyze (benchmark)
        working-directory: benchmark
        run: |
          flutter pub get
          flutter analyze
      - name: Contract scenarios + custom (VM)
        working-directory: benchmark
        run: flutter test bench/