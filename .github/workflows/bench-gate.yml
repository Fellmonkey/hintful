name: bench-gate

# Long device gate (~20 min) — not on every PR. Add `bench` label to run.
# On regression → PR comment, on success → check passes. Charts not pushed.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    if: contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bench gate (check, no record)
        uses: Fellmonkey/flutter_bench_contract/action@v1
        with:
          mode: check
          ref: android
          dir: benchmark
          flutter: '3.47'
          cache: 'true'
          comment: 'true'
          charts: 'false'
