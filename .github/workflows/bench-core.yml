name: bench-core

# The contract run — deliberately separate from CI: it needs an Android
# emulator (~20 min) and its outcome is published, not a gate. Dispatch
# manually; check `record` to write new goldens and re-render + commit the
# README "Performance" section and metrics card. All emulator setup (SDK,
# licenses, KVM, AVD) and the contract run live in the bench-contract-runner
# image; this workflow is just checkout → the shared action → commit.
on:
  workflow_dispatch:
    inputs:
      record:
        description: 'Record goldens into benchmarks.json (default: check against them)'
        type: boolean
        default: false
      flutter-version:
        description: 'Runner image tag = Flutter version of the goldens (e.g. 3.47)'
        default: '3.47'

permissions:
  contents: write

jobs:
  bench-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action pulls the runner image digest-pinned (tag→digest map in
      # the package repo's action.yml) and commits the rendered results in
      # record mode — no image or digest management here.
      - uses: Fellmonkey/flutter_bench_contract/action@v1
        with:
          mode: ${{ inputs.record && 'record' || 'check' }}
          ref: android
          dir: benchmark
          flutter: ${{ inputs.flutter-version }}
          commit: ${{ inputs.record }}
          commit-patterns: README.md docs/hint_metrics.png benchmark/benchmarks.json
      - name: Upload report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: |
            benchmark/build/contract_*.jsonl
            benchmark/build/custom_*.jsonl