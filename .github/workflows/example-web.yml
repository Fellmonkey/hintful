name: example-web

on:
  # The single definition of "the example builds for web": PRs validate the
  # build, only main pushes deploy (see the `if` on the deploy step). ci.yml used
  # to run a second, deploy-less copy of this build.
  pull_request:
    paths:
      - 'example/**'
      - 'lib/**'
      - '.github/workflows/example-web.yml'
  push:
    branches: [main]
    paths:
      - 'example/**'
      - 'lib/**'
      - '.github/workflows/example-web.yml'
  workflow_dispatch:

# Allow pushing to gh-pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build example (web)
        working-directory: example
        run: flutter build web --base-href /hintful/ --release

      - name: Deploy to gh-pages (keep bench charts)
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: example/build/web
          publish_branch: gh-pages
          keep_files: true
