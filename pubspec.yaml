name: hintful
description: Onboarding tours and tooltips for Flutter. Registry-based targets, theme-aware coach marks, smart positioning, accessible by default — zero cost when idle.
version: 1.0.0
repository: https://github.com/Fellmonkey/hintful
topics:
  - flutter
  - onboarding
  - tooltip
  - coach-marks
  - walkthrough
environment:
  # The floor is sealed-classes machine states (Dart 3.0 = Flutter 3.10).
  # The remaining engine contracts are covered by this minimum:
  #   CompositedTransform + FollowerLayer.getLastTransform — since Flutter 1.0 (2017),
  #   LayerLink.leaderSize — since 1.23 (PR #64930, Oct 2020),
  #   ThemeExtension — since 3.0 (PR #98033, Mar 2022).
  # Verified against the git history of a local Flutter 3.47.0 checkout.
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
