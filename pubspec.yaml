name: hintful
description: Onboarding tours and tooltips for Flutter. Registry-based targets, theme-aware coach marks, smart positioning, accessible by default — no overlay until a tour starts.
version: 2.0.0
repository: https://github.com/Fellmonkey/hintful
topics:
  - flutter
  - onboarding
  - tooltip
  - coach-marks
  - walkthrough
environment:
  # 2.x imports `package:material_ui/material_ui.dart`: Flutter formally
  # deprecated the bundled `package:flutter/material.dart` in 3.50 (it was
  # already marked deprecated in 3.47). `material_ui` 1.11.1 requires
  # Dart >=3.13 / Flutter >=3.47, so those are the new floors. Consumers on
  # older SDKs stay on the 1.x line (frozen API, legacy import).
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  # Official, decoupled Material library. This replaces the in-SDK
  # `flutter/material.dart` import that 3.50 deprecated.
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
