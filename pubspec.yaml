name: hintful
description: Onboarding tours and tooltips for Flutter. Registry-based targets, theme-aware coach marks, smart positioning, accessible by default — no overlay until a tour starts.
version: 1.0.0
repository: https://github.com/Fellmonkey/hintful
topics:
  - flutter
  - onboarding
  - tooltip
  - coach-marks
  - walkthrough
environment:
  # The floor is the single newest Flutter API the package touches:
  # MediaQuery.textScalerOf (default_tooltip.dart) — since Flutter 3.16
  # (Dart 3.2). Everything else is older and was verified against the git
  # history of a local Flutter 3.47.0 checkout:
  #   sealed machine states        — Dart 3.0 / Flutter 3.10,
  #   ThemeExtension               — Flutter 3.0 (PR #98033, Mar 2022),
  #   LayerLink.leaderSize         — Flutter 1.23 (PR #64930, Oct 2020),
  #   CompositedTransform +
  #   FollowerLayer.getLastTransform — Flutter 1.0 (2017).
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
