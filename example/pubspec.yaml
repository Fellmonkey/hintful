name: hintful_example
description: "Hintful demo app: tours, deferred targets, versioned hints, tap regions, blur/pulse scrim and the tour offer dialog."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  # The only dependency on the package — through the public barrel.
  hintful:
    path: ../
  # The ready-made persistent store (shared_preferences-backed) — the
  # companion package shipped alongside the core.
  hintful_prefs:
    path: ../../hintful_prefs
  # Versioned hints demo: shared_preferences under the store above (the
  # library core stays dependency-free — storage lives outside it).
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Benchmark skeleton: checkable invariants on a live device.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Resolve the core package locally during development (the path deps above).
dependency_overrides:
  hintful:
    path: ../

flutter:
  uses-material-design: true