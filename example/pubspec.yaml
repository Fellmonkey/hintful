name: hintful_example
description: "Hintful demo app: tours, deferred targets, versioned hints, tap regions, blur/pulse scrim and the tour offer dialog."
publish_to: 'none'
version: 0.1.0

environment:
  # Raised over the library floor: the demo reads
  # ColorScheme.surfaceContainerHighest (home_screen.dart) — Flutter 3.22.
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  # The only dependency on the package — through the public barrel.
  hintful:
    path: ../
  # Storage for the demo's store (lib/shared_prefs_hint_store.dart).
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Benchmark skeleton: checkable invariants on a live device.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true