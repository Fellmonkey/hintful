name: hintful_example
description: "Hintful acceptance playground: 4-step tour, deferred target, light/dark, showHint."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  # The only dependency on the package — through the public barrel.
  hintful:
    path: ../
  # Versioned hints demo: the app-side persistent HintStore (the library
  # core stays dependency-free — the app owns its storage).
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Benchmark skeleton: checkable invariants on a live device.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true